<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letters I Shared (Online Edition)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #fff0f5;
    color: #d6336c;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 2em;
  }

  /* Letter buttons grid */
  .letter-buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 800px;
    margin-bottom: 30px;
  }

  .letter-buttons button {
    background: #ffb6c1;
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 25px;
    padding: 10px;
    cursor: pointer;
    transition: 0.3s;
    text-align: center;
  }

  .letter-buttons button:hover {
    background: #ff1493;
  }

  /* Letter content card */
  .letter-content {
    background: #ffe6f0;
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 600px;
    margin-bottom: 20px;
    display: none;
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 0.5s ease, transform 0.5s ease;
    position: relative;
  }

  .letter-content.show {
    display: block;
    opacity: 1;
    transform: scale(1);
  }

  /* Navigation buttons */
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 600px;
    margin-bottom: 40px;
  }

  .nav-buttons button {
    background: #d6336c;
    color: white;
    border: none;
    border-radius: 25px;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  .nav-buttons button:disabled {
    background: #ffb6c1;
    cursor: not-allowed;
  }

  /* Floating Poems button */
  #poemsBtn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #d6336c;
    color: white;
    font-size: 14px;
    font-weight: bold;
    border: none;
    cursor: not-allowed;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 1000;
    transition: 0.3s;
  }

  #poemsBtn.unlocked {
    cursor: pointer;
    background: #ff1493;
  }

  /* Poems overlay modal */
  #poemsOverlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 182, 193, 0.95);
    z-index: 999;
    overflow: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  #poemsOverlay h2 {
    text-align: center;
    margin: 40px 0 20px 0;
  }

  #poemsOverlay p {
    white-space: pre-line;
    margin-bottom: 10px;
  }

  #poemsOverlay .closeBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 24px;
    background: #d6336c;
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    z-index: 1000;
  }
</style>
</head>
<body>

<h1>Letters I Shared (Online Edition)</h1>

<!-- Letter buttons grid -->
<div class="letter-buttons" id="letterButtons"></div>

<!-- Letter content -->
<div class="letter-content" id="letterContent">
  <p id="letterText"></p>
</div>

<!-- Navigation buttons -->
<div class="nav-buttons">
  <button id="prevBtn" onclick="prevLetter()" disabled>Previous</button>
  <button id="nextBtn" onclick="nextLetter()">Next</button>
</div>

<!-- Floating Poems button -->
<button id="poemsBtn" onclick="openPoems()">Poems</button>

<!-- Poems overlay -->
<div id="poemsOverlay">
  <button class="closeBtn" onclick="closePoems()">X</button>
  <h2>Poems Section</h2>
  <p>Here’s where your poems will appear.</p>
</div>

<script>
  // ==== Insert your 48 letters here ====
  const letters = [
    `January 1, 2026

Letter 1 content goes here...`,

    `January 2, 2026

Letter 2 content goes here...`,

    `January 3, 2026

Letter 3 content goes here...`,

    // ... continue until letter #48
  ];

  const letterButtonsDiv = document.getElementById("letterButtons");
  const letterText = document.getElementById("letterText");
  const letterContentDiv = document.getElementById("letterContent");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const poemsBtn = document.getElementById("poemsBtn");
  const poemsOverlay = document.getElementById("poemsOverlay");

  let currentLetter = 0;

  // Generate letter buttons dynamically
  letters.forEach((_, index) => {
    const btn = document.createElement("button");
    btn.innerText = `Letter #${index + 1}`;
    btn.addEventListener("click", () => showLetter(index));
    letterButtonsDiv.appendChild(btn);
  });

  function showLetter(index) {
    currentLetter = index;
    letterText.innerText = letters[index];

    // Animate fade-in
    letterContentDiv.classList.remove("show");
    letterContentDiv.style.display = "block";
    void letterContentDiv.offsetWidth; // trigger reflow
    letterContentDiv.classList.add("show");

    updateNav();
    letterContentDiv.scrollIntoView({behavior: "smooth"});
  }

  function nextLetter() {
    if (currentLetter < letters.length - 1) showLetter(currentLetter + 1);
  }

  function prevLetter() {
    if (currentLetter > 0) showLetter(currentLetter - 1);
  }

  function updateNav() {
    prevBtn.disabled = currentLetter === 0;
    nextBtn.disabled = currentLetter === letters.length - 1;

    // Unlock poems button only after last letter
    if (currentLetter === letters.length - 1) {
      poemsBtn.classList.add("unlocked");
      poemsBtn.disabled = false;
    }
  }

  function openPoems() {
    if (!poemsBtn.classList.contains("unlocked")) return;
    poemsOverlay.style.display = "flex";
    document.body.style.overflow = "hidden";
  }

  function closePoems() {
    poemsOverlay.style.display = "none";
    document.body.style.overflow = "auto";
  }

  // Initialize first letter
  showLetter(0);
</script>

</body>
</html>
