<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letters I Didn't Give, Compiled</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #fff0f5;
    color: #d6336c;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
  }

  .letter-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
  }

  .letter-buttons button {
    background: #ffb6c1;
    border: none;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    color: #fff;
    font-weight: bold;
    transition: 0.3s;
  }

  /* Hot-pink hover for letters */
  .letter-buttons button:hover {
    background: #ff1493; /* Hot pink */
  }

  .letter-content {
    background: #ffe6f0;
    padding: 20px;
    border-radius: 15px;
    width: 90%;
    max-width: 600px;
    margin-bottom: 20px;
    display: none;
    white-space: pre-line;
  }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
  }

  .nav-buttons button {
    background: #d6336c;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  .nav-buttons button:disabled {
    background: #ffb6c1;
    cursor: not-allowed;
  }

  /* Floating circular Poems button */
  #poemsBtn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #d6336c;
    color: white;
    font-size: 14px;
    font-weight: bold;
    border: none;
    cursor: not-allowed;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 10px;
    z-index: 1000;
    transition: 0.3s;
  }

  #poemsBtn.unlocked {
    cursor: pointer;
    background: #ff1493; /* hot pink */
  }

  /* Poems overlay */
  #poemsOverlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 182, 193, 0.95);
    z-index: 999;
    overflow: auto;
    padding: 20px;
  }

  #poemsOverlay .closeBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 24px;
    background: #d6336c;
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    z-index: 1000;
  }

  #poemsOverlay h2 {
    text-align: center;
    margin-top: 40px;
    margin-bottom: 20px;
  }

  #poemsOverlay p {
    white-space: pre-line;
    margin-bottom: 10px;
  }

  #unlockNote {
    text-align: center;
    font-size: 14px;
    margin-top: 10px;
    color: #888;
  }
</style>
</head>
<body>
<h1>Letters I Didn't Give, Compiled</h1>

<div class="letter-buttons" id="letterButtons"></div>

<div class="letter-content" id="letterContent">
  <p id="letterText"></p>
</div>

<div class="nav-buttons">
  <button id="prevBtn" onclick="prevLetter()" disabled>Previous</button>
  <button id="nextBtn" onclick="nextLetter()">Next</button>
</div>

<!-- Floating Poems button -->
<button id="poemsBtn" onclick="openPoems()">Poems</button>
<div id="unlockNote">Unlocks after reading the last letter (48th)</div>

<!-- Poems overlay -->
<div id="poemsOverlay">
  <button class="closeBtn" onclick="closePoems()">X</button>
  <h2>Poems Section</h2>
  <p>Here’s where your poems will appear. Add them later.</p>
</div>

<script>
  // Replace with your actual 48 letters
  const letters = [
    "January 1, 2026\n\nLetter 1 content...",
    "January 2, 2026\n\nLetter 2 content...",
    // ... continue until letter 48
    "February 17, 2026\n\nLetter 48 content..."
  ];

  const letterButtonsDiv = document.getElementById("letterButtons");
  const letterText = document.getElementById("letterText");
  const letterContentDiv = document.getElementById("letterContent");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const poemsBtn = document.getElementById("poemsBtn");

  let currentLetter = 0;

  // Generate letter buttons
  letters.forEach((_, index) => {
    const btn = document.createElement("button");
    btn.innerText = `Letter #${index + 1}`;
    btn.onclick = () => showLetter(index);
    letterButtonsDiv.appendChild(btn);
  });

  function showLetter(index) {
    currentLetter = index;
    letterText.innerText = letters[currentLetter];
    letterContentDiv.style.display = "block";
    updateNav();
    letterContentDiv.scrollIntoView({ behavior: "smooth" });
  }

  function nextLetter() {
    if (currentLetter < letters.length - 1) {
      currentLetter++;
      showLetter(currentLetter);
    }
  }

  function prevLetter() {
    if (currentLetter > 0) {
      currentLetter--;
      showLetter(currentLetter);
    }
  }

  function updateNav() {
    prevBtn.disabled = currentLetter === 0;
    nextBtn.disabled = currentLetter === letters.length - 1;

    // Unlock poems button only after last letter
    if (currentLetter === letters.length - 1) {
      poemsBtn.classList.add("unlocked");
      poemsBtn.disabled = false;
    }
  }

  function openPoems() {
    if (!poemsBtn.classList.contains("unlocked")) return;
    document.getElementById("poemsOverlay").style.display = "block";
  }

  function closePoems() {
    document.getElementById("poemsOverlay").style.display = "none";
  }

  // Initialize first letter
  showLetter(0);
</script>
</body>
</html>
