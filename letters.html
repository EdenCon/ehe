`Letter #1
The day we met and my first impressions o((>ω< ))o

I still remember how we first met, and honestly, it’s funny looking back at it now (not in a bad way, omkiee?).

During EDGE, I didn’t like you at first. (At first lang pod, karon kay more than like naman, HAHA.) Mostly because my friend didn’t like you, and I just went along with that. I never thought we’d end up being friends, ESPECIALLYY not the way we are now. Back then, you were just someone I didn’t pay much attention to. 🤯

Then the first week of classes happened. Ma’am Pat changed the seating arrangement, and I was placed on the 3rd row, 2nd column from the right. You were on my left. At first, I was ulaw to talk to you. I didn’t know what to say, and I wasn’t even sure I wanted to talk. My first impression of you was that you were smart and loud, please don’t get offended, first impression lang gyud nako back then.

But then you started talking to me. And we talked a lot, like, ALLAT. OMD AHAHA. Without me realizing it, you became my first friend in Pisay. You were there when I didn’t understand the lessons, when I doubted myself, and when I needed someone to explain things patiently. You never made me feel stupid or small. You just helped. :3

That’s when my impression of you started to change. I began to see you as kind, humble, and genuine. Good thoughts about you slowly replaced the old ones jdasdafeih. And somewhere along the way, very gradually, I started catching feelings. I didn’t expect it, but it happened. 🤯😛

It wasn’t anything grand or dramatic. It was your personality. The way you made me feel comfortable. The way I could tell you things without fear of being judged. You became someone I felt safe with, someone I trusted, someone who made things feel lighter just by being there. And honestly, we’re so ka-vibeee, like on the same freakuency, (we were both a bit freaky back then, HAHA.) being around you just clicks, everything fits perfectly. :>

And now, thinking about how it all started, I can’t help but smile. From disliking you, to sitting beside you, to calling you my first friend, and then something more. I guess life really has its own way of surprising us. 😸😺`,

`Letter #9
What I Admire About You

What I admire most about you is the way you keep trying, even when things aren’t easy. You don’t give up when things get heavy; you push through quietly, without needing praise or attention. That kind of strength is rare, and it says so much about who you are.

I admire your dedication to your responsibilities. Whether it’s academics, family, or the people you care about, you take everything seriously. You don’t do things halfway, and your effort shows in everything you accomplish. :>

Your intelligence is something I deeply admire, not just because you’re smart, but because of how you use it. You’re curious, thoughtful, and willing to learn. You don’t look down on others, and you’re always patient when helping someone understand.

There’s a kindness in you that feels genuine and effortless. You help without expecting anything in return, and you care without making a show out of it. The way you look out for others, even in small ways, says a lot about your heart.

I admire your humility. Despite everything you’re capable of, you remain grounded. You don’t feel the need to prove yourself to anyone, and that quiet confidence makes you even more admirable.

Your emotional strength stands out to me. You carry so much, yet you still choose to show up for others. Even when you’re tired or overwhelmed, you find ways to care, and that takes so much inner strength.

I admire the way you listen. You’re present, attentive, and sincere. When someone talks to you, they feel heard, and that’s a gift not everyone has.

Your willingness to grow is something I truly respect. You don’t see mistakes as failures, but as chances to learn and become better. That mindset makes you someone who will continue to grow no matter where life takes you.

I admire how you treat people with respect, regardless of who they are or what they can offer. Your kindness isn’t selective; it’s consistent. That speaks a lot about your character.

There’s something comforting about your presence. You don’t need to say much or do anything grand to make people feel at ease. Just being around you feels steady and reassuring.

I admire how responsible you are. You take care of the things that matter, remembering the little details, keeping your word, and looking out for the people you care about.

I admire your resilience. No matter what challenges come your way, you keep going, and you don’t let difficulties make you cold, if anything, they make you more understanding.

I admire your sincerity. The way you care, love, and commit is real, and it makes it easy to trust you.

I admire how you try to be better, not just for yourself, but for the people you care about. That effort means a lot to me.

All of this together makes you someone truly special, kind, strong, thoughtful, and genuine. And every day, I find more reasons to admire you for who you are, not just what you do.`,
  

  ];

  let current = 0;

  function openLetters() {
    document.getElementById("lettersSection").style.display = "block";
    buildBubbles();
    showLetter(0);
  }

  function buildBubbles() {
    const grid = document.getElementById("bubbleGrid");
    grid.innerHTML = "";
    letters.forEach((_, i) => {
      const div = document.createElement("div");
      div.className = "bubble";
      div.innerText = `#${i + 1}`;
      div.onclick = () => showLetter(i);
      grid.appendChild(div);
    });
  }

  function showLetter(index) {
    current = index;
    const box = document.getElementById("letterBox");
    const btn = document.getElementById("nextLetterBtn");

    box.innerText = letters[index];
    box.scrollTop = 0;
    btn.style.display = "none";

    box.onscroll = () => {
      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 10) {
        if (current < letters.length - 1) {
          btn.style.display = "block";
        }
      }
    };
  }

  function nextLetter() {
    if (current < letters.length - 1) {
      showLetter(current + 1);
    }
  }

  function prevLetter() {
    if (current > 0) {
      showLetter(current - 1);
    }
  }

  function goToPoems() {
    window.location.href = "poems.html";
  }
</script>
