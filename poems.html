<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poems Section</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #fff0f5;
    color: #d6336c;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
  }

  h1 {
    margin-bottom: 20px;
    text-align: center;
  }

  .poem {
    background: #ffe6f0;
    border-radius: 15px;
    padding: 20px;
    width: 90%;
    max-width: 600px;
    margin-bottom: 20px;
    white-space: pre-line;
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
    transform: scale(0.95);
  }

  .poem.show {
    opacity: 1;
    transform: scale(1);
  }

  .backBtn {
    background: #d6336c;
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 20px;
    transition: 0.3s;
  }

  .backBtn:hover {
    background: #ff1493;
  }
</style>
</head>
<body>
<h1>Poems Section</h1>

<!-- Example Poems -->
<div class="poem" id="poem1">Roses are red,
Violets are blue,
This is a poem,
Just for you.</div>

<div class="poem" id="poem2">Another poem,
Soft and sweet,
Words from the heart,
That you can keep.</div>

<button class="backBtn" onclick="goBack()">Back to Letters</button>

<script>
  // Simple fade-in animation for poems
  const poems = document.querySelectorAll('.poem');
  poems.forEach((poem, index) => {
    setTimeout(() => {
      poem.classList.add('show');
    }, index * 200); // stagger fade-in
  });

  function goBack() {
    // Go back to letters.html
    window.location.href = "letters.html";
  }
</script>
</body>
</html>
