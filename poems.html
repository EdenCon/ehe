<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Poems Collection</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #fff0f5;
    margin: 0;
    padding: 20px;
    color: #d6336c;
    position: relative;
    overflow-x: hidden;
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
  }

  /* Grid of poem cards */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .poem-card {
    background: #ffe4e1;
    border-radius: 15px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
    z-index: 2;
  }

  .poem-card:hover {
    transform: scale(1.05);
    background: #ffc0cb;
  }

  .poem-title {
    font-weight: bold;
    color: #b3003b;
    padding: 10px;
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* background: rgba(0,0,0,0.6);  <-- remove this */
    background: #fff0f5; /* fully opaque */
    z-index: 1000;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}


  .modal-content {
    background: #fff0f5;
    border-radius: 15px;
    padding: 20px;
    width: 90%;
    max-width: 600px;
    position: relative;
  }

  .modal-title {
    font-size: 1.5em;
    text-align: center;
    color: #d6336c;
    margin-bottom: 20px;
  }

  .modal-text {
    line-height: 1.5;
    color: #333;
    white-space: pre-line;
  }

  .close-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #d6336c;
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 1.2em;
    cursor: pointer;
    z-index: 1010;
  }

  /* Floating MWAA 😺 emojis */
  .floating {
    position: absolute;
    font-size: 24px;
    user-select: none;
    pointer-events: none;
    opacity: 0.6;
    animation: floatAnim 20s linear infinite;
  }

  @keyframes floatAnim {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(180deg); }
    100% { transform: translateY(0) rotate(360deg); }
  }
</style>
</head>
<body>

<h1>My Poems Collection</h1>

<div class="grid" id="poemsGrid"></div>

<!-- Modal -->
<div class="modal" id="poemModal">
  <button class="close-btn" id="closeModal">X</button>
  <div class="modal-content">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-text" id="modalText"></div>
  </div>
</div>

<script>
  // 30 sample poems (replace with your real poems)
  const poems = [
    {title: "Aking Pangarap", text: "Ito ang laman ng aking unang tula."},
    {title: "Pag-ibig sa Tag-init", text: "Mainit na damdamin, naglalakbay sa hangin."},
    {title: "Kalayaan", text: "Ang tunay na diwa ng kalayaan ay nasa puso."},
    {title: "Bituin sa Gabi", text: "Liwanag na nagbibigay pag-asa sa dilim."},
    {title: "Himig ng Hangin", text: "Sariwang simoy, dala'y kwento ng buhay."},
    {title: "Lihim ng Puso", text: "Hindi lahat ng damdamin ay nabubunyag."},
    {title: "Paglakbay", text: "Hakbang-hakbang sa landas ng pangarap."},
    {title: "Tahanan", text: "Lugar ng init at pagmamahalan."},
    {title: "Dahon sa Hangin", text: "Parang damdamin, palaging naglalakbay."},
    {title: "Umaga", text: "Bago sumikat ang araw, may pag-asa."},
    {title: "Gabi", text: "Tahimik ngunit puno ng mga kwento."},
    {title: "Pag-asa", text: "Liwanag sa gitna ng dilim."},
    {title: "Alon", text: "Tulad ng buhay, minsang tahimik, minsang malakas."},
    {title: "Luna", text: "Gabing maliwanag sa ilalim ng buwan."},
    {title: "Kaibigan", text: "Kasama sa bawat halakhak at luha."},
    {title: "Dreams", text: "Whispers of hope carried by the wind."},
    {title: "Summer Love", text: "Sun-kissed hearts and fleeting moments."},
    {title: "Freedom", text: "The soul soars where the mind dares."},
    {title: "Stars at Night", text: "Tiny lights guiding wandering dreams."},
    {title: "Song of the Wind", text: "Gentle whispers across the meadow."},
    {title: "Secret Heart", text: "Words unspoken, feelings hidden."},
    {title: "Journey", text: "Steps forward on unknown paths."},
    {title: "Home", text: "A place where hearts feel warmth."},
    {title: "Leaves in the Breeze", text: "Drifting like thoughts through time."},
    {title: "Morning", text: "New light, new hope in every dawn."},
    {title: "Night", text: "Silent, yet full of stories untold."},
    {title: "Hope", text: "A tiny spark that never dies."},
    {title: "Waves", text: "Life's rhythm, calm and stormy alike."},
    {title: "Moonlight", text: "Soft glow illuminating quiet dreams."},
    {title: "Friendship", text: "Shared laughter and unspoken bonds."}
  ];

  const grid = document.getElementById('poemsGrid');
  const modal = document.getElementById('poemModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const closeBtn = document.getElementById('closeModal');

  // Generate the poem cards
  poems.forEach(poem => {
    const card = document.createElement('div');
    card.className = 'poem-card';
    card.innerHTML = `<div class="poem-title">${poem.title}</div>`;
    card.addEventListener('click', () => {
      modal.style.display = 'flex';
      modalTitle.textContent = poem.title;
      modalText.textContent = poem.text;
    });
    grid.appendChild(card);
  });

  // Close modal
  closeBtn.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  // Click outside modal content closes it
  window.addEventListener('click', (e) => {
    if (e.target === modal) modal.style.display = 'none';
  });

  // ==== Floating MWAA 😺 emojis ====
  for (let i = 0; i < 20; i++) {
    const span = document.createElement('span');
    span.className = 'floating';
    span.textContent = 'MWAA 😺';
    span.style.top = Math.random() * window.innerHeight + 'px';
    span.style.left = Math.random() * window.innerWidth + 'px';
    span.style.animationDuration = 10 + Math.random() * 15 + 's'; // random speed
    document.body.appendChild(span);
  }
</script>

</body>
</html>
